<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXAM 桌游 AI 版 / AI Board Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">▤</span>
        <strong>EXAM</strong>
      </div>
      <div class="top-stat">
        <span>房间 / Room</span>
        <strong>7GHT2</strong>
      </div>
      <div class="top-stat">
        <span>回合 / Round</span>
        <strong id="roundLabel">1</strong>
      </div>
      <div class="top-stat">
        <span>当前 / Turn</span>
        <strong id="turnLabel">You</strong>
      </div>
      <button id="newGameBtn" class="ghost danger" type="button">重新开局 / New Game</button>
    </header>

    <section class="table" aria-label="EXAM 桌游桌面 / Board game table">
      <div id="players" class="players"></div>

      <section class="center-board">
        <div class="pile-area">
          <button id="drawBtn" class="pile-button" type="button">
            <span>抽牌堆 / Draw Pile</span>
            <div class="deck-card card back-card"></div>
            <small id="deckCount">0 张 / 0 cards</small>
          </button>

          <button id="discardBtn" class="pile-button" type="button">
            <span>弃牌堆 / Discard Pile</span>
            <div id="discardTop" class="deck-card"></div>
            <small id="discardCount">0 张 / 0 cards</small>
          </button>
        </div>

        <div class="turn-panel">
          <div id="phasePill" class="phase-pill">你的回合 / Your Turn</div>
          <p id="instruction">选择抽牌堆或弃牌堆。/ Choose the draw pile or discard pile.</p>
          <div id="drawnArea" class="drawn-area"></div>
          <div id="actionButtons" class="action-buttons"></div>
        </div>
      </section>

      <aside class="side-panel">
        <section class="mini-card">
          <h2>作弊检查 / Cheating Check</h2>
          <p id="checkPreview">游戏结束后随机揭示 1 条。/ One rule is revealed after the game.</p>
        </section>
        <section class="mini-card">
          <h2>牌局记录 / Game Log</h2>
          <div id="log" class="log"></div>
        </section>
      </aside>

      <section class="human-zone" aria-label="你的考卷 / Your exam">
        <div class="human-info">
          <div class="avatar">You</div>
          <div>
            <strong>You</strong>
            <span id="humanEstimate">已知风险：0 / Known Risk: 0</span>
          </div>
        </div>
        <div id="humanCards" class="human-cards"></div>
      </section>
    </section>
  </main>

  <dialog id="choiceDialog" class="dialog">
    <form method="dialog">
      <h2 id="dialogTitle">选择 / Choose</h2>
      <p id="dialogText"></p>
      <div id="dialogOptions" class="dialog-options"></div>
    </form>
  </dialog>

  <dialog id="scoreDialog" class="dialog score-dialog">
    <form method="dialog">
      <h2>最终计分 / Final Scores</h2>
      <p id="finalCheck"></p>
      <div id="scoreRows" class="score-rows"></div>
      <button id="playAgainBtn" class="primary wide" type="button">再玩一局 / Play Again</button>
    </form>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
